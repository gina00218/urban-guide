:root{color-scheme:dark;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#000;color:#e7e4dd}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#000}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #c9c2b3;outline-offset:5px}
main{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;background:#000;overflow:hidden;isolation:isolate}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}canvas.dragging{cursor:grabbing}
header{position:absolute;top:calc(25px + env(safe-area-inset-top));left:25px;right:25px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;text-shadow:0 1px 6px #000,0 0 12px #000}header[hidden]{display:none}
h1{margin:0;font-size:13px;font-weight:400;letter-spacing:5px}h1 span{display:inline-block;margin-left:15px;padding-left:17px;border-left:1px solid #57534b;font-size:10px;letter-spacing:3px;color:#b2aca0}.indicator{font-size:10px;color:#a6a095;letter-spacing:2px}.indicator i{width:5px;height:5px;border-radius:50%;background:#aaa294;display:inline-block;margin-right:8px}
footer{position:absolute;bottom:0;left:0;right:0;padding:18px 26px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#03030385 65%);text-align:center;text-shadow:0 1px 5px #000,0 0 9px #000;pointer-events:none}
.panel-toggle{display:block;margin:0 0 12px auto;min-height:32px;padding:7px 9px;border:1px solid #48443b;border-radius:3px;background:#030303c9;color:#c2bcae;font-size:10px;letter-spacing:1px;pointer-events:auto}.panel-toggle:hover{border-color:#aaa18c;color:white}footer.controls-collapsed{padding-top:0;background:none}footer.controls-collapsed .panel-toggle{margin-bottom:0}#controlPanel[hidden]{display:none}
.instruction{font-size:11px;letter-spacing:2px;color:#b7b1a5;margin:0 0 18px;min-height:16px;line-height:1.5}.actions{display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:auto}.actions button,.help button{min-height:36px;border:1px solid #58544b;border-radius:3px;color:#d8d3c8;background:#171612b3;padding:7px 16px;font-size:11px;letter-spacing:2px;white-space:nowrap}.actions button.secondary{color:#999386;background:transparent;border-color:#33312c;padding-inline:12px}.actions button:hover,.help button:hover{border-color:#aaa18c;color:white}

 <h2 id="settingsTitle">選擇操作</h2>
 <p>螢幕朝向自己，按「啟用傾斜」並允許感測。以目前姿勢校正 0°，像轉圓盤一樣轉動手機。</p>

        route.push({id,from:{...head},to:end,start:total,length,touch:Math.min(.999,contact/Math.max(.001,distance*fraction))});
        total+=length;head=end;mass+=prey.mass;
      }
      const pursuitLength=total;
      const homeLength=Math.max(.001,Math.hypot(head.x-W/2,head.y-H/2,head.z));
      total+=homeLength;
      // Match pixels travelled per second to the active movement before pursuit.
      if(!plan.frontPixelsPerDegree){
        const frames=plan.hunters[0].frames;
        const first=Math.max(1,Math.floor((plan.completed*20/45-8)/.098));
        const last=Math.min(frames.length-1,Math.floor((plan.completed*40/45-8)/.098));
        let distance=0;
        for(let n=first;n<=last;n++)distance+=Math.hypot(frames[n].x-frames[n-1].x,frames[n].y-frames[n-1].y);
        plan.frontPixelsPerDegree=distance/Math.max(.001,(last-first+1)*.098*45/plan.completed);
      }
      const planarLength=route.reduce((sum,step)=>sum+Math.hypot(step.to.x-step.from.x,step.to.y-step.from.y),0)+Math.hypot(head.x-W/2,head.y-H/2);
      const match=clamp(plan.frontPixelsPerDegree/Math.max(.001,planarLength/45),1,3);
      pursuitPlaybackRate=mix(2,match*2,smooth(45,48,forward));
      const travel=clamp((forward-45)/45)*total;
      const originalMass=eater.mass;
      eater.mass=originalMass;
      for(const step of route){
        const prey=cores[step.id],u=clamp((travel-step.start)/step.length);
        const eaten=smooth(step.touch,1,u);prey.refConsumed=eaten;
        eater.mass+=prey.mass*eaten;prey.mass*=1-eaten;prey.radius=radius(prey.mass);
      }
      // Traverse by distance, including overlapping prey, with no per-dot waiting time.
      const pathPoint=distance=>{
        const d=clamp(distance,0,total);
        for(const step of route){
          if(d<=step.start+step.length){
            const u=clamp((d-step.start)/step.length);
            return {x:mix(step.from.x,step.to.x,u),y:mix(step.from.y,step.to.y,u),z:mix(step.from.z,step.to.z,u)};
          }
        }
        const home=clamp((d-pursuitLength)/homeLength);
        return {x:mix(head.x,W/2,home),y:mix(head.y,H/2,home),z:head.z*(1-home)};
      };
      // Blend several nearby positions to round corners without stopping at prey.
      const roundedPoint=distance=>{
        const bend=Math.min(scale*.10,distance*.35,(total-distance)*.35);
        const weights=[1,6,15,20,15,6,1];
        const position={x:0,y:0,z:0};
        for(let n=0;n<weights.length;n++){
          const point=pathPoint(distance+(n-3)*bend/3),weight=weights[n]/64;
          position.x+=point.x*weight;position.y+=point.y*weight;position.z+=point.z*weight;
        }
        return position;
      };
      const rounded=roundedPoint(travel);
      eater.x=rounded.x;eater.y=rounded.y;eater.z=rounded.z;
      // Match both position and velocity at each end of the transition.
      if(forward<49){
        const frames=plan.hunters[0].frames;
        const end=frames[Math.min(lastFrame,k)],previous=frames[Math.max(0,Math.min(lastFrame,k)-2)];
        const degreesPerSample=.098*45/plan.completed;
        const initial={x:mix(frames[k].x,frames[Math.min(lastFrame,k+1)].x,sample-k),
          y:mix(frames[k].y,frames[Math.min(lastFrame,k+1)].y,sample-k)};
        const duration=4,u=clamp((forward-45)/duration);
        const joinDistance=total*duration/45,epsilon=Math.max(.01,scale*.002);
        const finish=roundedPoint(joinDistance);
        const before=roundedPoint(joinDistance-epsilon),after=roundedPoint(joinDistance+epsilon);
        const h00=2*u*u*u-3*u*u+1,h10=u*u*u-2*u*u+u;
        const h01=-2*u*u*u+3*u*u,h11=u*u*u-u*u;
        for(const axis of ['x','y']){
          const incoming=(end[axis]-previous[axis])/(2*degreesPerSample);
          const outgoing=(after[axis]-before[axis])/(2*epsilon)*total/45;
          eater[axis]=h00*initial[axis]+h10*duration*incoming+h01*finish[axis]+h11*duration*outgoing;
        }
      }
      eater.radius=radius(eater.mass);
    }
    guidedRoute(scene,angle,dt,leg,reverse,textDistance,distanceFromText,t,plan,cores);
    // Rotate the volume, then sort by camera depth so near spheres occlude far ones.
    const focal=Math.max(460,scale*8);
    const space=smooth(0,6,t);
    const yaw=0;
    const pitch=0;
    const projectionX=W/2,projectionY=H/2;
    const projected=scene.map(bead=>{
      const dx=bead.x-projectionX,dy=bead.y-projectionY;
      const rx=dx*Math.cos(yaw)+bead.z*Math.sin(yaw);
      const rz=bead.z*Math.cos(yaw)-dx*Math.sin(yaw);
      const ry=dy*Math.cos(pitch)+rz*Math.sin(pitch);
      const z=rz*Math.cos(pitch)-dy*Math.sin(pitch);
      return {...bead,rx,ry,z};
    }).sort((a,b)=>a.z-b.z);
    for(const bead of projected){
      const z=bead.z;
      const perspective=focal/Math.max(focal*.3,focal-z);
      const x=projectionX+bead.rx*perspective;
      const y=projectionY+bead.ry*perspective;
      const r=Math.max(.08,bead.radius*perspective);
      ctx.globalAlpha=1;
      if((bead.materialRadius??r)>1.6){
        ctx.drawImage(beadSprite,x-r,y-r,r*2,r*2);
      }else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
    }
    ctx.globalAlpha=1;
    lastPaint=angle;
  }
  const paint=render;
  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    if(ready){routeWorld=null;wallMotion=false;huntPaths=[null,null];mesoPlans=[null,null];rebuild();paint(current);}
  }
  function stage(p){
    const phase=(p*360)%180;
    if(phase<5||phase>175)return '01 / 文字排列完成';
    if(phase<40)return '02 / 小點散開';
    if(phase<65)return '03 / 小點合成中點';
    if(phase<90)return '04 / 一顆大點逐步吃完剩餘點點';
    if(phase<115)return '05 / 大點反向散開成點點';
    return '06 / 小點重新排列成文字';
  }

  function updateUI() {
    $('angle').textContent=current.toFixed(1).padStart(5,'0')+'\u00b0';
    const displayed=Math.abs(current-360)<.02?360:cycle(current);
    $('angle').textContent=displayed.toFixed(1).padStart(5,'0')+'°';
    if(!scrubbing)$('scrub').value=displayed;
    $('scrub').style.setProperty('--progress',(displayed/3.6)+'%');
    $('stage').textContent=stage(cycle(current)/360);
    $('play').textContent=auto?UI.pause:UI.play;$('play').setAttribute('aria-pressed',String(auto));
    $('gyro').textContent=sensor?UI.gyroOff:UI.gyro;
    $('mode').textContent=sensor?UI.modeGyro:auto?UI.modeAuto:UI.modeManual;
  }
  function say(message) {$('status').textContent=message;}
  function detachSensor() {
    sensor=false;sensorTextAnchor=null;prevQ=null;rawHeading=null;clearTimeout(timeoutID);
    window.removeEventListener('deviceorientation',onOrientation);
  }
  function manual(angle,immediate=false) {
    auto=false;textHoldRemaining=0;detachSensor();target=Number.isFinite(Number(angle))?Number(angle):0;
    if(immediate){current=target;vel=0;paint(current);}
    say(UI.manualHelp);updateUI();
  }
  function startAuto() {
    detachSensor();
    autoOrigin=current;autoBegin=performance.now();filteredPlaybackRate=pursuitPlaybackRate;
    textHoldRemaining=Math.abs(current/180-Math.round(current/180))<.00001?TEXT_HOLD_SECONDS:0;
    auto=true;
    say(UI.previewHelp);updateUI();
  }
  function tick(now) {
    const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;
    if(auto) {
      // Match visible pursuit movement to the preceding roaming speed.
      filteredPlaybackRate=mix(filteredPlaybackRate,pursuitPlaybackRate,1-Math.exp(-14*dt));
      if(textHoldRemaining>0){
        textHoldRemaining=Math.max(0,textHoldRemaining-dt);
      }else{
        const boundary=direction>0?(Math.floor(target/180)+1)*180:(Math.ceil(target/180)-1)*180;
        // Slow the departure from each sentence, then ease back to normal speed.
        const departure=cycle(target*direction)%180;
        const textProximity=Math.min(departure,180-departure);
        const breakupRate=mix(.45,1.8,smooth(35,65,textProximity));
        const next=target+dt*8*filteredPlaybackRate*breakupRate*direction;
        if(direction>0?next>=boundary:next<=boundary){
          target=boundary;current=boundary;vel=0;
          textHoldRemaining=TEXT_HOLD_SECONDS;
        }else target=next;
      }
    }
    // Analytic, critically damped spring. Frame-rate independent, no bouncing.
    if(sensor){
      // Sensor deltas have already been shortest-angle unwrapped. Filter the
      // continuous angle so 359 -> 0 never takes a full reverse turn.
      const textAngle=Math.round(target/180)*180;
      if(sensorTextAnchor!==null&&Math.abs(target-sensorTextAnchor)>3)sensorTextAnchor=null;
      if(sensorTextAnchor===null&&Math.abs(target-textAngle)<=1.5)sensorTextAnchor=textAngle;
      current=sensorTextAnchor!==null?sensorTextAnchor:mix(current,target,1-Math.exp(-dt/.055));
      vel=0;
      if(sensorTextAnchor===null&&Math.abs(current-target)<.025)current=target;
    }
    const omega=24,decay=Math.exp(-omega*dt),err=current-target;
    const t=(vel+omega*err)*dt;
    if(!sensor){current=target+(err+t)*decay;vel=(vel-omega*t)*decay;}

    if((!sensor||sensorTextAnchor===null)&&Math.abs(current-target)<.0005&&Math.abs(vel)<.005){current=target;vel=0;}
    frameStep=dt*60;if(!Number.isFinite(lastPaint)||Math.abs(current-lastPaint)>.00001||wallMotion)paint(current,dt);
    frameMS=frameMS*.97+dt*1000*.03;
    // Do not rebuild particle identities in the middle of a transition.
    if(now-lastUI>50){updateUI();lastUI=now;}
    requestAnimationFrame(tick);
  }
  $('play').addEventListener('click',()=>{
    if(auto){auto=false;target=current;vel=0;say(UI.paused);}else startAuto();
    updateUI();
  });
  $('reset').addEventListener('click',()=>{routeWorld=null;wallMotion=false;manual(0,true);say(UI.ready);});
  $('scrub').addEventListener('input',e=>manual(e.target.value));
  $('scrub').addEventListener('pointerdown',()=>{scrubbing=true;auto=false;detachSensor();});
  window.addEventListener('pointerup',()=>{scrubbing=false;});
  window.addEventListener('pointercancel',()=>{scrubbing=false;});
  document.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>{manual(Number(b.dataset.angle));if($('options').open)$('options').close();}));
  window.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();$('play').click();}
    else if(e.key==='ArrowRight'){e.preventDefault();manual(target+(e.shiftKey?15:3));}
    else if(e.key==='ArrowLeft'){e.preventDefault();manual(target-(e.shiftKey?15:3));}
    else if(e.key==='Home'){e.preventDefault();manual(0);}
    else if(e.key==='End'){e.preventDefault();manual(360);}
    else if(e.key==='Escape'){if($('options').open)$('options').close();else setClean(false);}
  });
  let dragging=false,dragX=0,dragAngle=0;
  canvas.addEventListener('pointerdown',e=>{manual(current);dragging=true;dragX=e.clientX;dragAngle=current;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
  canvas.addEventListener('pointermove',e=>{if(dragging)target=dragAngle+(e.clientX-dragX)*360/Math.max(280,W);});
  function dragEnd(){dragging=false;canvas.classList.remove('dragging');}
  canvas.addEventListener('pointerup',dragEnd);canvas.addEventListener('pointercancel',dragEnd);
  // W3C orientation order: Rz(alpha) * Rx(beta) * Ry(gamma).
  // Relative quaternion twist around the DEVICE Z axis tracks rotating the
  // phone like a dial, unlike alpha alone (which tracks the earth Z axis).
  const qNow=new Float64Array(4),qPrevious=new Float64Array(4);
  function onOrientation(e) {
    if(!sensor||!Number.isFinite(e.alpha)||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    if(!sensorGotData){sensorGotData=true;clearTimeout(timeoutID);say(UI.sensorHelp);}
    let delta=0;
    if(sensorType==='heading'){
      const raw=e.alpha;
      if(rawHeading===null){rawHeading=raw;return;}
      delta=raw-rawHeading;rawHeading=raw;
      if(delta>180)delta-=360;if(delta< -180)delta+=360;
      // Heading unwrap: 359 -> 0 advances +1; 0 -> 359 retreats -1.
    }else{
      const a=e.alpha*DEG/2,b=e.beta*DEG/2,g=e.gamma*DEG/2;
      const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
      qNow[0]=ca*sb*cg-sa*cb*sg;qNow[1]=ca*cb*sg+sa*sb*cg;
      qNow[2]=ca*sb*sg+sa*cb*cg;qNow[3]=ca*cb*cg-sa*sb*sg;
      if(prevQ===null){qPrevious.set(qNow);prevQ=true;return;}
      let w=qPrevious[3]*qNow[3]+qPrevious[0]*qNow[0]+qPrevious[1]*qNow[1]+qPrevious[2]*qNow[2];
      let z=qPrevious[3]*qNow[2]-qPrevious[2]*qNow[3]-qPrevious[0]*qNow[1]+qPrevious[1]*qNow[0];
      // Measure each change in the previous device frame, then advance the baseline.
      qPrevious.set(qNow);
      if(w<0){w=-w;z=-z;}
      if(Math.hypot(w,z)<1e-8)return;
      delta=-2*Math.atan2(z,w)/DEG;
      if(delta>180)delta-=360;if(delta< -180)delta+=360;
    }
    // Reject a sensor restart/outlier, not normal wraparound.
    if(!Number.isFinite(delta)||Math.abs(delta)>55)return;
    // Unbounded accumulated sensor angle; wrap is handled in the delta above.
    accum+=delta*direction*sensitivity;
    target=accum;
  }
  async function enableGyro() {
    if(sensor){detachSensor();say(UI.manualHelp);updateUI();return;}
    auto=false;
    if(!window.isSecureContext){say(UI.needHTTPS);updateUI();return;}
    if(!('DeviceOrientationEvent' in window)){say(UI.noSensor);updateUI();return;}
    try {
      // Called directly by a user gesture: necessary for the iOS permission UI.
      if(typeof DeviceOrientationEvent.requestPermission==='function') {
        const result=await DeviceOrientationEvent.requestPermission();
        if(result!=='granted'){say(UI.denied);updateUI();return;}
      }
      sensor=true;sensorGotData=false;sensorTextAnchor=null;prevQ=null;rawHeading=null;
      accum=0;target=0;current=0;vel=0;paint(0);
      window.addEventListener('deviceorientation',onOrientation,{passive:true});
      say(UI.waitSensor);updateUI();
      timeoutID=setTimeout(()=>{
        if(!sensorGotData){detachSensor();say(UI.noData);updateUI();}
      },4500);
    }catch(err){detachSensor();say(UI.permissionError+' '+(err.message||''));updateUI();}
  }
  $('gyro').addEventListener('click',enableGyro);
  $('calibrate').addEventListener('click',()=>{
    accum=0;sensorTextAnchor=null;prevQ=null;rawHeading=null;target=0;current=0;vel=0;auto=false;paint(0);say(UI.calibrated);updateUI();
  });
  $('axis').addEventListener('change',e=>{
    sensorType=e.target.value;sensorTextAnchor=null;prevQ=null;rawHeading=null;accum=current;say(UI.axisChanged);
  });
  $('direction').addEventListener('change',e=>{direction=e.target.checked?-1:1;sensorTextAnchor=null;prevQ=null;rawHeading=null;accum=current;});
  $('sensitivity').addEventListener('change',e=>{sensitivity=Number(e.target.value);sensorTextAnchor=null;accum=current;});
  function setClean(on){
    clean=on;$('controlPanel').hidden=on;$('headerControls').hidden=on;
    const toggle=$('toggleControls');toggle.closest('footer').classList.toggle('controls-collapsed',on);
    toggle.setAttribute('aria-expanded',String(!on));toggle.textContent=on?'展開控制':'收合控制';
  }
  $('toggleControls').addEventListener('click',()=>setClean(!clean));
  $('settingsButton').addEventListener('click',()=>{$('options').showModal();});
  $('closeOptions').addEventListener('click',()=>{$('options').close();});
  $('options').addEventListener('close',()=>{(clean?$('toggleControls'):$('settingsButton')).focus({preventScroll:true});});
  $('fullscreen').addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
        try{await screen.orientation.lock('portrait');}catch(_){/* optional */}
      }else if(document.fullscreenElement)await document.exitFullscreen();
      else say(UI.noFullscreen);
    }catch(_){say(UI.noFullscreen);}
  });
  document.addEventListener('visibilitychange',()=>{
    last=performance.now();prevQ=null;rawHeading=null;
    if(document.hidden){auto=false;target=current;vel=0;}
  });
  let resizeTimer;
  window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,120);},{passive:true});


  Object.assign(UI,{title:'為你好 / 選擇',subtitle:'轉到 180° 顯示第二句，360° 回到第一句。',gyro:'啟用傾斜',gyroOff:'停用旋轉感應',ready:'轉動手機，讓點點彈跳，看看選擇的另一面。',manualHelp:'左右拖曳或使用滑桿；反向操作可逐步還原。',paused:'預覽已暫停，點點繼續隨當下的受力彈跳。'});
  document.querySelectorAll('[data-label]').forEach(el=>el.textContent=UI[el.dataset.label]||'');
  $('sourceText').textContent='';$('targetText').textContent='';
  document.title='選擇 — 為你好';
  canvas.setAttribute('aria-label','白色圓形粒子組成的選擇情境，拖曳可改變角度');
  $('scrub').setAttribute('aria-label','旋轉角度 0 至 360 度');
  $('description').textContent='0° 我們都決定好了；180° 你就該完成我的夢想，整句倒置；360° 回到第一句。';
  window.vortex={setAngle:a=>manual(a,true),getStats:()=>({count:particles.length,angle:current,target,width:W,height:H,sensor,auto,quality,pursuitPlaybackRate}),getSource:()=>DATA,setClean,particles:()=>particles,cores:()=>coreState,middle:()=>lastMeso};
  window.vortex.ready=(async()=>{
    resize();
    say('正在準備粒子字形…');
    await Promise.race([document.fonts.load('700 90px "Noto Serif TC"','我們都決定好了你就該完成我的夢想'),new Promise(r=>setTimeout(r,3500))]).catch(()=>{});
    rebuild();
    await new Promise(r=>setTimeout(r,0));
    roamingPlan(0);
    await new Promise(r=>setTimeout(r,0));
    roamingPlan(1);
    ready=true;paint(current);say(UI.ready);updateUI();
    if(params.has('angle'))manual(Number(params.get('angle')),true);
    if(lockedForCapture)setClean(true);
    // Geometry uses embedded reference points and does not depend on font loading.
  })();
  requestAnimationFrame(tick);
})();
</script>
